[ThriftServer@mioto]
port            =   10100
num-thread      =   4

[SimpleConnectionPool@mioto]
driver          =   com.mysql.jdbc.Driver
host            =   127.0.0.1:3306
dbname          =   mioto_lab
uname           =   mioto
pwd             =   mioto@9876
max-conn        =   4
conn-timeout    =   5000
wait-timeout    =   3000

[MysqlClient@mioto]
nretry          =   2
log-query       =   true

[SimpleCache@user]
max-size        =   1000
ttl-seconds     =   300          # 5 minutes: profiles change rarely

[SimpleCache@session]
max-size        =   5000
ttl-seconds     =   120          # 2 minutes: SHORT, so logout takes effect quickly

